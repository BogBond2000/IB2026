name: CI Security Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  security-scan:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: lab1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install --upgrade -r requirements.txt
          pip install --upgrade bandit safety pip-audit

      - name: Show installed versions
        run: pip freeze | grep -Ei "flask|bcrypt|jwt|markupsafe|setuptools|bleach|dotenv" || true

      - name: SAST - Bandit
        run: |
          bandit -r . -f txt -o bandit-report.txt || true
          bandit -r . -ll

      - name: SCA - Safety (project requirements only)
        run: |
          safety check --full-report -r requirements.txt || true

      - name: SCA - pip-audit (project requirements only)
        run: |
          pip-audit -r requirements.txt || true

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: lab1/bandit-report.txt